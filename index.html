<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf0"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><title>날담 · 오늘의 이야기</title><style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#423b35;background:#fffaf0}*{box-sizing:border-box}body{margin:0}main{max-width:700px;margin:auto;padding:20px 16px 90px}.hero{text-align:center;padding:20px 0 14px}.hero img{width:90px;height:90px;object-fit:contain}.hero h1{margin:3px 0;font-size:29px}.muted{color:#92877e;font-size:13px}.card{background:white;border:1px solid #eee3d6;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 4px 15px #5d43200a}.eyebrow{font-size:12px;color:#a07752;font-weight:700;letter-spacing:.04em}.quote{font-size:19px;font-weight:650;line-height:1.6}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.cal-head h2{font-size:19px;margin:0}button{font:inherit;cursor:pointer;background:#faf3e9;border:1px solid #e9dac6;border-radius:12px;padding:9px 13px;color:#65513c}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.week span{text-align:center;font-size:12px;color:#98877a;padding:8px 0}.days button{border:0;border-radius:12px;background:transparent;min-height:49px;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px}.days button.selected{background:#f0dfc7;font-weight:750}.days button.today{outline:1px solid #c3a17a}.days button.sunday{color:#b96b62}.days button.saturday{color:#6d8da9}.days button:disabled{opacity:0;cursor:default}.dot{font-size:10px;color:#b58b53;line-height:1.1}.event{padding:13px 0;border-bottom:1px solid #f2ebe2}.event:last-child{border:0}.event strong{display:block;font-size:15px;margin:4px 0}.event p{font-size:13px;line-height:1.6;margin:4px 0;color:#6e655e}.empty{font-size:13px;color:#92877e}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1}.tabs .active{background:#e8d3b8}.hidden{display:none}textarea{width:100%;min-height:115px;border:1px solid #e6d8c6;border-radius:12px;padding:12px;font:inherit;resize:vertical}#save{margin-top:8px}#status{font-size:12px;color:#8d6c51;margin-left:8px}#login{background:#fee500;color:#3b3027;border:0}#logout{font-size:12px} .notice{font-size:12px;line-height:1.6;color:#8c7867}
</style></head><body><main><header class="hero"><img src="./icons/icon-192.png" alt="날담 아이콘"><h1>날담</h1><div class="muted">지나간 날을 기억하고, 오늘을 기록합니다.</div></header><section class="card"><div class="eyebrow">오늘의 한 줄</div><div class="quote" id="quote">오늘의 이야기를 불러오는 중…</div><div class="muted" id="todayText"></div></section><section class="card"><div class="cal-head"><button id="prev" aria-label="이전 달">‹</button><h2 id="month"></h2><button id="next" aria-label="다음 달">›</button></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="days" id="days"></div></section><section class="card"><div class="eyebrow" id="selectedLabel"></div><div class="tabs"><button class="active" data-tab="korea">🇰🇷 한국사</button><button data-tab="world">🌍 세계사</button><button data-tab="nature">🌿 계절</button></div><div id="events"></div></section><section class="card"><div class="eyebrow">나의 하루 기록</div><p class="notice" id="authInfo">메모는 카카오 로그인 연결 후 기존 Supabase 데이터와 연동할 예정입니다. 이 버전에서는 저장하지 않습니다.</p><button id="login" class="hidden">카카오 로그인</button><button id="logout" class="hidden">로그아웃</button><textarea id="memo" placeholder="오늘의 기록을 남겨보세요" disabled></textarea><div><button id="save" disabled>메모 저장</button><span id="status">로그인 연결 준비 중</span></div></section><p class="notice">날담 웹 버전 1차 미리보기 · 기존 Render 앱과 별도로 실행됩니다. 역사 및 계절 자료는 기존 날담 저장소에서 가져왔습니다. 음력·절기·공휴일 계산 및 계정 연동은 후속 단계입니다.</p></main><script>
let DATA=null,selected=new Date(),view=new Date(selected.getFullYear(),selected.getMonth(),1),tab='korea';const $=id=>document.getElementById(id);const key=d=>`${d.getMonth()+1}-${d.getDate()}`;const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const same=(a,b)=>iso(a)===iso(b);const text=(tag,value,cls)=>{let el=document.createElement(tag);el.textContent=value;if(cls)el.className=cls;return el};function render(){if(!DATA)return;$('month').textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`;$('days').replaceChildren();let first=new Date(view.getFullYear(),view.getMonth(),1).getDay(),total=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();for(let i=0;i<Math.ceil((first+total)/7)*7;i++){let n=i-first+1,b=document.createElement('button');if(n<1||n>total){b.disabled=true;b.textContent='·'}else{let d=new Date(view.getFullYear(),view.getMonth(),n);b.append(text('span',String(n)));let k=key(d);if(DATA.korea[k]?.length||DATA.world[k]?.length)b.append(text('span','•','dot'));if(same(d,selected))b.classList.add('selected');if(same(d,new Date()))b.classList.add('today');if(d.getDay()===0)b.classList.add('sunday');if(d.getDay()===6)b.classList.add('saturday');b.onclick=()=>{selected=d;render()}}$('days').append(b)}}$('selectedLabel').textContent=`${selected.getFullYear()}년 ${selected.getMonth()+1}월 ${selected.getDate()}일의 이야기`;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let list=[];if(tab==='nature'){let period=selected.getDate()<=10?'early':selected.getDate()<=20?'mid':'late';let item=DATA.nature[`${selected.getMonth()+1}-${period}`];if(item)list=[{title:item.title,description:[item.landscape,...item.flowers,...item.fruits,...item.fields,...item.animals].filter(Boolean).join(' · '),year:item.season}]}else list=DATA[tab][key(selected)]||[];let host=$('events');host.replaceChildren();if(!list.length)host.append(text('p','이 날짜에 등록된 이야기가 아직 없어요.','empty'));for(let item of list){let box=document.createElement('div');box.className='event';box.append(text('div',[item.year,item.country,item.category].filter(Boolean).join(' · '),'muted'));box.append(text('strong',item.title));box.append(text('p',item.description||''));if(item.why)box.append(text('p','💡 '+item.why));host.append(box)}}
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});fetch('./data.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{DATA=d;let today=new Date();$('todayText').textContent=iso(today);let seed=today.getFullYear()*10000+(today.getMonth()+1)*100+today.getDate();$('quote').textContent=d.quotes[seed%d.quotes.length];render()}).catch(e=>{$('quote').textContent='데이터를 불러오지 못했어요. 웹 서버에서 실행해 주세요.';console.error(e)});if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
